        var stack = String((reason && reason.stack) || '');

          (stack.indexOf('fbevents.js') !== -1 ||
            stack.indexOf('connect.facebook.net') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1)
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
